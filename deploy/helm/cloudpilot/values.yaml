replicaCount: 1
persistence:
  size: 1Gi
  # Empty uses the cluster default StorageClass (kind needs a local provisioner).
  storageClass: ""

image:
  repository: cloudpilot
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
