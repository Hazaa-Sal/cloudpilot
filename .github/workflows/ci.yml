name: CloudPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -v apps/api/tests

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/environments/dev validate

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deploy/helm/cloudpilot

      - name: Render Kubernetes manifests
        run: helm template cloudpilot deploy/helm/cloudpilot > /tmp/cloudpilot.yaml

      - name: Validate Compose
        run: docker compose --profile monitoring config --quiet

      - name: Validate Prometheus config
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Start local monitoring stack
        run: docker compose --profile monitoring up -d --build --wait

      - name: Verify live metrics and provisioned dashboard
        run: python scripts/smoke.py

      - name: Collect container logs
        if: failure()
        run: docker compose --profile monitoring logs

      - name: Stop CI containers
        if: always()
        run: docker compose --profile monitoring down
